<div id="spice-atlas-eda">
  <h3>Two ways to map the same 57 spice profiles</h3>
  <div class="atlas-charts">
    <div><div>Current axes · warmth and brightness</div><svg data-plot="current" role="img" aria-label="Current warmth and brightness projection. Several spices occupy identical coordinates."></svg></div>
    <div><div>All five flavor dimensions · PCA</div><svg data-plot="pca" role="img" aria-label="Principal component projection of all five flavor axes. Preserves more of the nearest flavor neighbors."></svg></div>
  </div>
  <div class="text-small" data-detail>Hover or tap a dot to inspect the same spice in both projections.</div>
</div>
<style>
#spice-atlas-eda .atlas-charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
#spice-atlas-eda svg{display:block;width:100%;height:320px;overflow:visible}
#spice-atlas-eda svg text{fill:var(--foreground);font-size:12px}
#spice-atlas-eda .domain,#spice-atlas-eda .tick line{stroke:var(--border)}
#spice-atlas-eda [data-detail]{min-height:2.5em}
@media(max-width:680px){#spice-atlas-eda .atlas-charts{grid-template-columns:1fr}}
</style>
